<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:ital,wght@0,600;1,600&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f6f5f0;color:#141414;font-family:Inter,sans-serif;position:relative}
.rule{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(20,20,20,.12)}
.l{left:96px}.r{right:96px}
.dots{position:absolute;left:96px;right:96px;top:0;height:190px;background-image:radial-gradient(rgba(20,20,20,.2) 1.5px,transparent 1.5px);background-size:18px 18px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.glow{position:absolute;width:760px;height:760px;right:-200px;top:-260px;background:radial-gradient(closest-side,rgba(217,126,56,.22),transparent 70%)}
.wrap{position:absolute;left:150px;right:120px;top:200px;display:flex;gap:44px;align-items:center}
.av{flex:none;width:168px;height:168px;border-radius:22px;border:2px solid rgba(20,20,20,.1);background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.av:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(20,20,20,.06) 0 6px,transparent 6px 15px)}
.avw{position:relative;flex:none}.ring{position:absolute;inset:-10px;border:2px dashed rgba(20,20,20,.16);border-radius:26px;transform:rotate(8deg)}
.mono{position:relative;z-index:1;font-family:'Bricolage Grotesque';font-style:italic;font-weight:600;font-size:88px;letter-spacing:-.04em}
.mono span{color:#a35a17}
h1{font-family:'Bricolage Grotesque';font-weight:600;font-size:84px;letter-spacing:-.025em;line-height:1}
.tag{font-family:'IBM Plex Mono';font-size:23px;white-space:nowrap;color:#3a3a38;margin-top:18px}
.strip{position:absolute;left:0;right:0;bottom:64px;height:64px;border-top:2px solid rgba(20,20,20,.1);border-bottom:2px solid rgba(20,20,20,.1);background:repeating-linear-gradient(135deg,rgba(20,20,20,.05) 0 8px,transparent 8px 20px);display:flex;align-items:center;justify-content:center;gap:40px;font-family:'IBM Plex Mono';font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#55554f}
.dot{display:inline-block;width:10px;height:10px;border-radius:9px;background:#2ca76c;box-shadow:0 0 0 5px rgba(44,167,108,.25);margin-right:14px;vertical-align:middle}
</style></head><body>
<div class="glow"></div><div class="dots"></div><div class="rule l"></div><div class="rule r"></div>
<div class="wrap"><div class="avw"><div class="ring"></div><div class="av"><span class="mono">v<span>s</span></span></div></div>
<div><h1>Vaibhav Singh</h1><p class="tag">Fullstack engineer · data-heavy B2B AI products</p><p class="tag" style="font-size:21px;color:#6a6a64;margin-top:10px">React · Next.js · TypeScript · Python · FastAPI</p></div></div>
<div class="strip"><span><span class="dot"></span>Case studies inside</span><span>Bengaluru</span><span>4+ years</span></div>
</body></html>
