     Matches the site's light theme: neutral off-white page, white tile, no decoration. -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Bricolage+Grotesque:ital,wght@0,600;1,600&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f7f7f7;color:#141414;font-family:Inter,sans-serif;position:relative}
.rule{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(0,0,0,.08)}
.l{left:96px}.r{right:96px}
.wrap{position:absolute;left:156px;right:156px;top:50%;transform:translateY(-50%);display:flex;gap:48px;align-items:center}
.av{flex:none;width:168px;height:168px;border-radius:24px;border:2px solid rgba(0,0,0,.08);background:#fff;display:grid;place-items:center}
.mono{font-family:'Bricolage Grotesque';font-style:italic;font-weight:600;font-size:88px;letter-spacing:-.04em}
.mono span{color:#a35a17}
h1{font-family:'Bricolage Grotesque';font-weight:600;font-size:80px;letter-spacing:-.025em;line-height:1}
.lede{font-size:30px;line-height:1.35;color:#3a3a3a;margin-top:20px;max-width:640px;text-wrap:balance}
.meta{font-family:'IBM Plex Mono';font-size:20px;color:#666;margin-top:22px;display:flex;align-items:center;gap:14px}
.dot{width:10px;height:10px;border-radius:9px;background:#2ca76c;box-shadow:0 0 0 5px rgba(44,167,108,.22)}
</style></head><body>
<div class="rule l"></div><div class="rule r"></div>
<div class="wrap">
  <div class="av"><span class="mono">v<span>s</span></span></div>
  <div>
    <h1>Vaibhav Singh</h1>
    <p class="lede">Fullstack engineer building data-heavy B2B AI products.</p>
    <p class="meta"><span class="dot"></span>Software Engineer at DataPOEM · Bengaluru</p>
  </div>
</div>
</body></html>
